<section class="contact-section">
    <div class="columbia-frame">
        <div class="ornament top-left"></div>
        <div class="ornament top-right"></div>

        <div class="content-wrapper">
            <h1 class="columbia-title">CONTACTO</h1>
            <div class="divider"></div>

            <div class="personal-info">
                <h2 class="name">EDWIN STEVEN NIÑO TORRES</h2>
                <p class="role">Ingeniero de Sistemas y Computación</p>
                <p class="university">Universidad Pedagógica y Tecnológica de Colombia (UPTC)</p>
            </div>

            <div class="button-container">
                <button class="vigor-btn linkedin" (click)="openLinkedIn()">
                    <span class="icon">LINKEDIN</span>
                    <span class="sub-text">RED PROFESIONAL</span>
                </button>

                <button class="vigor-btn github" (click)="openGitHub()">
                    <span class="icon">GITHUB</span>
                    <span class="sub-text">REPOSITORIO DE CÓDIGO</span>
                </button>

                <button class="vigor-btn email" (click)="sendEmail()">
                    <span class="icon">CORREO</span>
                    <span class="sub-text">CONTACTO DIRECTO</span>
                </button>
            </div>
        </div>

        <div class="ornament bottom-left"></div>
        <div class="ornament bottom-right"></div>
    </div>
</section>
